[package]
name = "lexbench"
version = "0.1.0"
edition = "2021"
description = "swc/oxc lexer 计时 harness，输出与 my-scanner bench 相同口径的 JSON"

[dependencies]
# 第三方版本策略（自动跟踪，见 docs/benchmarks.md「第三方版本」）：两个对标
# lexer 锚 oxc_parser / swc_ecma_parser 由 scripts/prepare-lexbench.sh 探测
# crates.io 最新稳定版并改写为 =<ver>（改动进 git，cargo update 同步落
# Cargo.lock；报告里的实测版本戳与锁同源）。伴随 crate 不设上限，由 cargo 在
# 锚的兼容范围内解析到最新版——升锚时一并前移，无需手工钉版。
oxc_allocator = "*"
oxc_span = "*"
# lexer 模块仅在 benchmarking feature 下公开（oxc 官方 lexer benchmark 同款入口）
oxc_parser = { version = "=0.150.0", features = ["benchmarking"] }
swc_common = "*"
# unstable: 暴露 TokenAndSpan 等（决策注入驱动需要；见 docs/architecture.md
# 的「swc/oxc 决策注入」一节）
swc_ecma_parser = { version = "=45.1.3", features = ["unstable"] }
swc_ecma_ast = "*"
# oxc_lexer（多位图流水线实验 crate）孵化期 publish=false，不在 crates.io；
# path 指向 scripts/prepare-lexbench.sh 跟踪 oxc main 拉取的 oxc 仓源码树
# （该树保留 crates/ + 根 Cargo.toml，workspace 继承与 sibling path 依赖方能解析）。
# 先跑 scripts/prepare-lexbench.sh 再 cargo build，否则 path 缺失报错。
oxc_lexer = { path = "../../.bench-deps/oxc/crates/oxc_lexer" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# 决策注入驱动需要 oxc 暴露 next_regex / next_template_substitution_tail
# （上游均为 pub(crate)）。vendored 副本仅改这两处可见性，其余与 crates.io
# 一致；目录固定 .bench-deps/oxc_parser，内容版本随 prepare-lexbench.sh 跟踪。
[patch.crates-io]
oxc_parser = { path = "../../.bench-deps/oxc_parser" }
