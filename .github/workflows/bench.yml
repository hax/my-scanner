name: bench

on:
  push:
    branches: [main]
    # 纯文档与报告页改动不跑差分+基准（workflow_dispatch 手动触发不受限）
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - 'scripts/report/**'
  workflow_dispatch:

permissions:
  contents: write # 发布报告到 bench-reports 分支

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 语料在 corpus 分支(只含语料不含源码),检出到 corpus/ 目录
      - uses: actions/checkout@v5
        with:
          ref: corpus
          path: corpus
          fetch-depth: 1

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # swc/oxc 对照(lexbench-rs)的 Rust 工具链;oxc_parser MSRV 1.96,用 stable
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/lexbench-rs

      - name: 安装对拍依赖(tsc)
        working-directory: tools
        run: npm ci

      - name: 差分门禁 + 架构矩阵基准 + 报告
        env:
          BENCH_REPEATS: "25"
        run: ./scripts/ci-bench.sh

      - name: 摘要
        run: cat build/bench/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: 发布到 bench-reports 分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: node scripts/report/publish-report.mjs --dir build/bench

      - name: 上传原始产物
        uses: actions/upload-artifact@v6
        with:
          name: bench-${{ github.sha }}
          path: build/bench/
          retention-days: 90
